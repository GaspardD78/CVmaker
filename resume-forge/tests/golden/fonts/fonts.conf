<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Configuration fontconfig des golden tests (passée à Chromium via FONTCONFIG_FILE).
  - reprend la configuration système (Liberation pour Arial/Helvetica/Times, etc.) ;
  - ajoute Gelasio, versionnée dans ce dossier ;
  - force les équivalents métriques des polices Microsoft utilisées par les templates.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>

  <match target="pattern">
    <test qual="any" name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Gelasio</string></edit>
  </match>
</fontconfig>
