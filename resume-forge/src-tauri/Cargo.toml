[package]
name = "resume-forge"
version = "1.1.0"
description = "ResumeForge - Créez et personnalisez vos CV professionnels"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "resume_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-shell = "2"
headless_chrome = "1.0.21"
tempfile = "3.27.0"
url = "2.5.8"

[target.'cfg(target_os = "android")'.dependencies]
# JNI bridge to LoginLauncher / LoginActivity for session-cookie login.
# `ndk-context` exposes the Android Context + JavaVM that the runtime sets
# up at startup, so we can call our Kotlin helpers without writing a full
# Tauri Android plugin.
jni = "0.21"
ndk-context = "0.1"
