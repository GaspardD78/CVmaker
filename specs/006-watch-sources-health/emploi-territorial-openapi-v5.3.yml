          - oui
          - non
    email:
      name: email
      in: query
      description: 'Filtre par adresse e-mail du demandeur'
      required: false
      style: form
      explode: false
      schema:
        type: string
        pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
    num:
      name: num
      in: query
      description: "Filtre par n° de la demande d'emploi"
      required: false
      style: form
      explode: false
      schema:
        type: string
    date:
      name: date
      in: query
      description: "Filtre par date de mise à jour, au format AAAA-MM-JJ\n        (comprend les dates de création / mises à jour et renouvellement des demandes).\n        Ce filtre prend en compte les demandes d'emploi, de la date passée en paramètre,\n         jusqu'à la date du jour"
      required: false
      schema:
        type: string
        format: yyyy-mm-dd
      example: '2000-01-01'
    cr:
      name: cr
      in: query
      description: "Inclure ou non les opérations de recrutement du conseil régional\n        -1 => exclure, 0 => inclure, 1 => n'inclure que le conseil régional,\n        -2 => exclure conseils régionaux et départementaux, 2 => inclure uniquement les conseils départementaux)"
      schema:
        type: integer
        default: 0
        enum:
          - -2
          - -1
          - 0
          - 1
          - 2
  headers:
    X-RateLimit-Limit:
      description: "Nombre maximal de requêtes pouvant être effectuées à partir de ce compte\n   jusqu'à l'expiration de la session de connexion"
      schema:
        type: integer
        example: '1000'
    X-RateLimit-Remaining:
      description: "Nombre restant de requêtes pouvant être effectuées à partir de ce compte\n   jusqu'à l'expiration de la session de connexion"
      schema:
        type: integer
        example: '999'
    X-RateLimit-Reset:
      description: 'Timestamp UNIX de réinitialisation de la session de connexion'
      schema:
        type: integer
  securitySchemes:
    tokenHeader:
      type: apiKey
      description: "Token d'authentification transmis par le support GIPCDG"
      name: X-API-Key
      in: header
security:
  -
    tokenHeader: []
tags:
  -
    name: token
    description: "Informations sur les droits associés au jeton d'accès utilisé sur l'API Emploi-Territorial"
  -
    name: referentiels
    description: "Accès aux listes des référentiels utilisés sur le site Emploi-Territorial.\n  <br />L'accès est possible pour tout utilisateur disposant d'un token valide (CDG, partenaire ou collectivité)"
  -
    name: col
    description: "Accès aux données spécifiques d'une collectivité.\n L'accès se fait avec un token généré depuis la page Mes donnnées > Fiche collectivité de l'espace employeur."
  -
    name: cdg
    description: "Accès aux données spécifiques d'un Centre de Gestion.\n L'accès se fait avec un token spécifique, à demander par l'intermédiaire d'un ticket sur le site support du GIPCDG."
  -
    name: demandeurs
    description: "Accès à la CVthèque d'Emploi-Territorial.\n  <br />L'accès est uniquement possible pour des partenaires conventionnées,\n  avec un consentement préalable des demandeurs dont les données personnelles sont communiquées."
  -
    name: stats
    description: "Rapports d'utilisation du site Emploi-Territorial.\n  <br />L'accès est uniquement possible sur demande ou pour les CDG disposant d'un token d'accès."
