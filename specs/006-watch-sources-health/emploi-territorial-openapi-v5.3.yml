openapi: 3.0.0
info:
  title: 'API Emploi-Territorial'
  description: "Ressources concernant l'emploi public territorial,\n        mises à disposition par les Centres de Gestion de la Fonction Publique Territoriale\n        dans le cadre de leur mission de publicité légale des vacances d'emploi et de promotion de l'emploi territorial.\n        <br />L'accès à ces ressources nécessite une authentification,\n        contactez le GIP Informatique des CDG pour plus d'informations."
  contact:
    name: 'GIP Informatique des Centres de Gestion'
    url: 'https://www.gipcdg.fr'
    email: support@gipcdg.fr
  license:
    name: 'Etalab 2.0'
    url: 'https://www.etalab.gouv.fr/wp-content/uploads/2017/04/ETALAB-Licence-Ouverte-v2.0.pdf'
  version: '5.3'
servers:
  -
    url: /api
    description: 'Environnement actuel'
  -
    url: 'https://www.emploi-territorial.fr/api'
    description: 'Environnement de production'
  -
    url: 'https://demo.emploi-territorial.fr/api'
    description: 'Environnement de démonstration'
paths:
  /token/info:
    get:
      tags:
        - token
      summary: "Retourne les catégories de points d'entrée utilisables avec le token fourni en authentification"
      operationId: fc10dcdbf769820642ad4531d297f98e
      responses:
        '200':
          description: "Renvoie dans l'objet success les droits\n                   sur les catégories de points d'entrée pouvant faire l'objet de requêtes\n                   avec le jeton fourni en authentification"
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                required:
                  - status
                  - status_message
                  - success
                allOf:
                  - { $ref: '#/components/schemas/ReponseStandard' }
                  - { properties: { success: { $ref: '#/components/schemas/DroitsUtilisateur' } }, type: object }
        default:
          $ref: '#/components/responses/default'
  /referentiels/metiers:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des métiers actifs'
      operationId: 4e1b788fb253b2452fe496c333c256d7
      parameters:
        -
          $ref: '#/components/parameters/cod_sfam'
        -
          $ref: '#/components/parameters/cod_fam'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/metiersdetail:
    get:
      tags:
        - referentiels
      summary: 'Retourne une liste détaillée des métiers'
      operationId: de5d33e73ca54664862493f147730bae
      parameters:
        -
          $ref: '#/components/parameters/cod_metier'
        -
          $ref: '#/components/parameters/cod_sfam'
        -
          $ref: '#/components/parameters/cod_fam'
        -
          $ref: '#/components/parameters/actif'
      responses:
        '200':
          $ref: '#/components/responses/tableau'
        default:
          $ref: '#/components/responses/default'
  /referentiels/sfamillesmetiers:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des sous-familles de métiers actives'
      operationId: 13d9c98267641eea41ec43f968e589f3
      parameters:
        -
          $ref: '#/components/parameters/cod_fam'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/famillesmetiers:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des familles de métiers actives'
      operationId: abd2dbf96c934d45c3275c74c9478d35
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/grades:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des grades de la Fonction Publique Territoriale,\nsous forme d'une liste de clé (code grade Emploi-Territorial) / valeur (libellé du grade)"
      operationId: b6b46d7d4c60f2d60fae72b0637bfcad
      parameters:
        -
          $ref: '#/components/parameters/grade'
        -
          $ref: '#/components/parameters/cemp'
        -
          $ref: '#/components/parameters/fil'
        -
          $ref: '#/components/parameters/cat'
        -
          $ref: '#/components/parameters/actif'
        -
          $ref: '#/components/parameters/special'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/gradesdetail:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste détaillée des grades de la Fonction Publique Territoriale,\nsous forme d'une liste d'objets détaillés avec en-tête"
      operationId: b29c207c17952930a301f4c8d7cfe0d4
      parameters:
        -
          $ref: '#/components/parameters/grade'
        -
          $ref: '#/components/parameters/cemp'
        -
          $ref: '#/components/parameters/fil'
        -
          $ref: '#/components/parameters/cat'
        -
          $ref: '#/components/parameters/actif'
        -
          $ref: '#/components/parameters/special'
      responses:
        '200':
          $ref: '#/components/responses/tableau'
        default:
          $ref: '#/components/responses/default'
  /referentiels/cadresemplois:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des cadres d'emplois actifs de la Fonction Publique Territoriale"
      operationId: 5b03974c8c3419e303847557fa14d48a
      parameters:
        -
          $ref: '#/components/parameters/fil'
        -
          $ref: '#/components/parameters/cat'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/filieres:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des filières de la Fonction Publique Territoriale'
      operationId: 4a3a4b319925900a041802a17ce6089a
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/typesemploi:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des types d'emploi. Cette liste peut varier selon le CDG de rattachement d'une collectivité."
      description: "Voir la page [/faq#ReponseFPTPER](/faq#ReponseFPTPER) pour une description textuelle des types d'emploi."
      operationId: 364edcf9a0db2771299af8f6717d90b2
      parameters:
        -
          $ref: '#/components/parameters/one_etab'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/detailtypeemploi:
    get:
      tags:
        - referentiels
      summary: "Retourne les caractéristiques d'un type d'emploi"
      operationId: 3b94f4ed750dd9a4f41fd8f73f03e43f
      parameters:
        -
          $ref: '#/components/parameters/cod_typ_op'
      responses:
        '200':
          description: "Renvoie dans l'objet success les caractéristiques du type d'emploi"
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                required:
                  - status
                  - status_message
                  - success
                allOf:
                  - { $ref: '#/components/responses/default' }
                  - { properties: { success: { $ref: '#/components/schemas/TypeEmploi' } }, type: object }
        default:
          $ref: '#/components/responses/default'
  /referentiels/modesrecrutement:
    get:
      tags:
        - referentiels
      summary: "Récupère la liste des modes de recrutement. Cette liste dépend du grade de recrutement et du type d'emploi."
      operationId: 79aafe5ad0638fb3e028e1bc6eafb2e3
      parameters:
        -
          $ref: '#/components/parameters/one_grade'
        -
          $ref: '#/components/parameters/cod_typ_op'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/departements:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des départements avec leur code utilisé sur Emploi-Territorial'
      operationId: 0722f64574fdfbc3c1898d3abf4dc0a7
      parameters:
        -
          $ref: '#/components/parameters/reg'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/secteursgeographiques:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des secteurs géographiques utilisés sur Emploi-Territorial'
      operationId: e7bda340147a865b2c71b05c224be22a
      parameters:
        -
          $ref: '#/components/parameters/dep'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/regions:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des régions avec leur code utilisé sur Emploi-Territorial'
      operationId: 2d47f7886b2198fd30a6ccfe98610bee
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/categoriesjuridiques:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des catégories juridiques de collectivités et établissements territoriaux.'
      description: "Reprend partiellement le [référentiel de l'INSEE](https://www.insee.fr/fr/information/2028129)"
      operationId: 5495eb22c8e66dcf2d5db83d37609f82
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/fondementsjuridiques:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des fondements juridiques de recrutement des contractuels\nsur une opération de recrutement. Cette liste dépend du type d'emploi."
      operationId: 4952b7beebe337536deb082da9294676
      parameters:
        -
          $ref: '#/components/parameters/cod_typ_op'
      responses:
        '200':
          $ref: '#/components/responses/tableau'
        default:
          $ref: '#/components/responses/default'
  /referentiels/motifsannulation:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des motifs d'annulation de déclarations de vacance d'emploi pouvant être renseignés sur\nEmploi-Territorial."
      operationId: 5d73fc921aaa7e9dba69226109cfddc7
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/motifsdeclaration:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des motifs de saisie d'une déclaration de vacance d'emploi."
      description: "Les valeurs possibles dépendent du type d'emploi."
      operationId: c7d12a94bb269827b38887e2e2f96824
      parameters:
        -
          $ref: '#/components/parameters/cod_typ_op'
      responses:
        '200':
          $ref: '#/components/responses/tableau'
        default:
          $ref: '#/components/responses/default'
  /referentiels/etab:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des établissements adhérents'
      operationId: 315e806d3a55b32572457362b75e3706
      parameters:
        -
          name: type
          in: query
          description: "type d'établissement à retourner (0 => CDG adhérents,\n                    1 => CNFPT, 2 => CDG coordonnateurs régionaux, 3 => ministères adhérents,\n                    4 => SDIS, 5 => tous les établissements)"
          schema:
            type: integer
            default: 0
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
              - 5
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/situationpro:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des situations actuelles des demandeurs inscrits sur Emploi-Territorial'
      operationId: f1c20d30a9576a72995e441beba0b7de
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/niveauxetudes:
    get:
      tags:
        - referentiels
      summary: 'Retourne la liste des niveaux de scolarité associés aux demandeurs ou aux nominations'
      operationId: d0318d6e72e1168ddf62ce8d62d37c25
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/caces:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des habilitations (de type CACES)\nque les demandeurs peuvent sélectionner lors de l'édition de leur profil"
      operationId: b12d53c6d95893ba7866760348a35d66
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /referentiels/permis:
    get:
      tags:
        - referentiels
      summary: "Retourne la liste des permis de conduire que les demandeurs peuvent sélectionner lors de l'édition de leur profil"
      operationId: 4495b426f9b13be1883e848afe8ff27d
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /col/info:
    get:
      tags:
        - col
      summary: "Renvoie les informations de la fiche collectivité reliée au token d'authentification sur Emploi-Territorial"
      operationId: 6f10483f4b357c3895b81d06c14a0f5c
      parameters:
        -
          $ref: '#/components/parameters/siret'
      responses:
        '200':
          $ref: '#/components/responses/details-col'
        default:
          $ref: '#/components/responses/default'
  /col/rattachements:
    get:
      tags:
        - col
      summary: "Renvoie le numéro SIRET (en clé) et le libellé des collectivités rattachées à la collectivité\nprincipale authentifiée"
      operationId: 041a484fdc54c111fb70db27ff14a6fa
      parameters:
        -
          $ref: '#/components/parameters/siret'
      responses:
        '200':
          $ref: '#/components/responses/cles_valeurs'
        default:
          $ref: '#/components/responses/default'
  /col/listoffres:
    get:
      tags:
        - col
      summary: 'Retourne une liste des offres de la collectivité authentifiée'
      operationId: 94999413bb3742dac47af415e8ae0658
      parameters:
        -
          $ref: '#/components/parameters/siret'
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/offset'
        -
          $ref: '#/components/parameters/grade'
        -
          name: date_cr_min
          in: query
          description: 'Date de saisie minimale. Formats de saisie possibles : jj/mm/aaaa, aaaa-mm-dd, intervalle de date en anglais.'
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
          example: '-1 year'
        -
          name: date_cr_max
          in: query
          description: 'Date de saisie maximale (incluse)'
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
          example: now
        -
          name: publie
          in: query
          description: "État de l'offre (1 => en cours de publication, 0 => toutes les offres"
          required: false
          style: form
          explode: false
          schema:
            type: integer
            default: 1
            enum:
              - 0
              - 1
      responses:
        default:
          $ref: '#/components/responses/default'
        '200':
          $ref: '#/components/responses/tableau'
  /col/listdec:
    get:
      tags:
        - col
      summary: 'Retourne une liste des déclarations passées sur un arrêté pour la collectivité authentifiée'
      operationId: 13a9f1dd31268f62e1b256344f49955a
      parameters:
        -
          $ref: '#/components/parameters/siret'
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/offset'
        -
          $ref: '#/components/parameters/grade'
        -
          name: date_cr_min
          in: query
          description: 'Date de saisie minimale. Formats de saisie possibles : jj/mm/aaaa, aaaa-mm-dd, intervalle de date en anglais.'
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
          example: '-1 year'
        -
          name: date_cr_max
          in: query
          description: 'Date de saisie maximale (incluse)'
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
          example: now
        -
          name: etat
          in: query
          description: 'État de la déclaration (-1 => tous, 0 => en cours de validation, 1 => exécutoire, 2 => annulée, 3 => nommée, 4 => transmissible ou en attente de modification)'
          required: false
          style: form
          explode: false
          schema:
            type: integer
            default: 1
            enum:
              - -1
              - 0
              - 1
              - 2
              - 3
              - 4
      responses:
        default:
          $ref: '#/components/responses/default'
        '200':
          $ref: '#/components/responses/tableau'
  '/col/{id}/detailoffre':
    get:
      tags:
        - col
      summary: "Retourne le détail complet d'une offre"
      operationId: 7dee244fc23f554b6b019c93bf981dae
      parameters:
        -
          $ref: '#/components/parameters/siret'
        -
          name: id
          in: path
          description: "Numéro d'offre'"
          required: true
          style: simple
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        default:
          $ref: '#/components/responses/default'
        '200':
          $ref: '#/components/responses/tableau'
  '/col/{id}/detaildec':
    get:
      tags:
        - col
      summary: "Retourne le détail complet d'une déclaration"
      operationId: 3e3225b31768fa7005ee2e2884a062f4
      parameters:
        -
          $ref: '#/components/parameters/siret'
        -
          name: id
          in: path
          description: 'Numéro de déclaration'
          required: true
          style: simple
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        default:
          $ref: '#/components/responses/default'
        '200':
          $ref: '#/components/responses/tableau'
  /col/transmetop:
    post:
      tags:
        - col
      summary: 'Crée ou modifie une opération de recrutement pour le compte de la collectivité authentifiée.'
      description: "Elle sera créée (avec une offre et le cas échéant une déclaration) à l'état transmise pour validation auprès\ndu CDG ou du CNFPT, ou mise à jour si elle existe déjà."
      operationId: e9c4d5b747445d3c7642cf635ae240af
      parameters:
        -
          $ref: '#/components/parameters/siret'
      requestBody:
        description: 'Objet du type opération de recrutement Emploi-Territorial au format JSON'
        required: true
        content:
          application/json:
            schema:
              description: 'Objet reprenant les éléments des schémas OperationRecrutementAPI et opContact'
              type: object
              allOf:
                -
                  $ref: '#/components/schemas/OperationRecrutement'
                -
                  $ref: '#/components/schemas/OperationContact'
      responses:
        '200':
          $ref: '#/components/responses/retour-post-transmission-op'
        default:
          $ref: '#/components/responses/default'
  /col/annuleop:
    post:
      tags:
        - col
      summary: "Annule et cloture sans embauche et de façon irrémédiable une opération préalablement transmise\npar le point d'entrée col/transmetop."
      operationId: c9e920c89e279475b1625580d5b29bc1
      parameters:
        -
          $ref: '#/components/parameters/siret'
      requestBody:
        description: "Objet indiquant la référence de l'opération à supprimer"
        required: true
        content:
          application/json:
            schema:
              required:
                - applicatif_envoi
                - num_externe
              properties:
                num_externe:
                  description: "Numéro de l'opération d'Emploi-Territorial, ou numéro unique d'offre interne à la collectivité ou à son logiciel de recrutement"
                  type: string
                  maxLength: 100
                  minLength: 1
                  example: OFR-0001-2021
                applicatif_envoi:
                  description: "Nom de l'application utilisée pour l'envoi de la requête"
                  type: string
                  maxLength: 100
                  minLength: 5
                  example: 'E-Recrutement 2042'
                motif_annulation:
                  description: "Code du motif d'annulation du recrutement. Voir le point d'entrée referentiels/motifsannulation pour la liste des valeurs possibles. Requis si la déclaration de l'opération a été validée et a déjà fait l'objet d'une publicité légale."
                  type: string
                  maxLength: 2
                  example: '02'
              type: object
      responses:
        default:
          $ref: '#/components/responses/default'
  /col/depublieop:
    post:
      tags:
        - col
      summary: "Dépublie l'offre d'emploi en cours de publication d'une opération préalablement transmise par le point\nd'entrée col/transmetop, puis validée par le CDG ou le CNFPT. Pour republier une offre dépubliée, relancer\nun appel du point d'entrée col/transmetop avec les mêmes données que celles passées sur la dépublication."
      operationId: 2a00e4ea961478d974755d5e86ad1c1c
      parameters:
        -
          $ref: '#/components/parameters/siret'
      requestBody:
        description: "Objet indiquant la référence de l'opération à dépublier"
        required: true
        content:
          application/json:
            schema:
              required:
                - applicatif_envoi
                - num_externe
              properties:
                num_externe:
                  description: "Numéro de l'opération d'Emploi-Territorial, ou numéro unique d'offre interne  à la collectivité ou à son logiciel de recrutement"
                  type: string
                  maxLength: 100
                  minLength: 1
                  example: OFR-0001-2021
                applicatif_envoi:
                  description: "Nom de l'application utilisée pour l'envoi de la requête"
                  type: string
                  maxLength: 100
                  minLength: 5
                  example: 'E-Recrutement 2042'
              type: object
      responses:
        '200':
          $ref: '#/components/responses/retour-post-transmission-op'
        default:
