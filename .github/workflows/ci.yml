name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: TypeScript + tests (bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-forge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  rust:
    name: Clippy (Tauri backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: resume-forge/src-tauri
      - run: cargo clippy --manifest-path resume-forge/src-tauri/Cargo.toml --all-targets -- -D warnings
